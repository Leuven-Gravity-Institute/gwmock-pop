name: Documentation

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        outputs:
            artifact: github-pages-${{ github.run_attempt }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false
            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  python-version: '3.14.3'
                  enable-cache: 'true'

            - name: Install dependencies
              run: uv sync --group docs --frozen

            - run: uv run --frozen zensical build -f zensical.toml
            - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
              with:
                  path: site
                  # Attempt-scoped so a re-run of the build does not leave two
                  # same-named artifacts in the run, which deploy-pages rejects.
                  name: github-pages-${{ github.run_attempt }}

    # deploy-pages looks the artifact up once, with no retry, and the run's
    # artifact list can lag the upload: run in the job that uploaded, it found
    # none a fraction of a second after the upload finalized. So the deploy is
    # a job of its own, as in GitHub's Pages workflows; it waits until the
    # artifact is listed, and deploys a second time if the first attempt fails.
    # The name comes from the build job, so re-running only a failed deploy (a
    # later attempt) still finds the artifact the earlier build uploaded.
    deploy:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            actions: read
            pages: write
            id-token: write
        environment:
            name: github-pages
            url:
                ${{ steps.deployment.outputs.page_url ||
                steps.deployment-retry.outputs.page_url }}
        steps:
            - name: Wait until the artifact is listed
              env:
                  GH_TOKEN: ${{ github.token }}
                  ARTIFACT: ${{ needs.build.outputs.artifact }}
              run: |
                  for _ in $(seq 30); do
                      count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=${ARTIFACT}" --jq '.total_count')
                      if [ "${count}" -ge 1 ]; then exit 0; fi
                      sleep 10
                  done
                  echo "::error::Artifact ${ARTIFACT} was not listed after 5 minutes."
                  exit 1
            - id: deployment
              continue-on-error: true
              uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
              with:
                  artifact_name: ${{ needs.build.outputs.artifact }}
            - name: Wait before deploying again
              if: steps.deployment.outcome == 'failure'
              run: sleep 60
            - id: deployment-retry
              if: steps.deployment.outcome == 'failure'
              uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
              with:
                  artifact_name: ${{ needs.build.outputs.artifact }}
