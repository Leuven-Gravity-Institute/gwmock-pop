name: Documentation

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        outputs:
            artifact: github-pages-${{ github.run_attempt }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false
            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  python-version: '3.14.3'
                  enable-cache: 'true'

            - name: Install dependencies
              run: uv sync --group docs --frozen

            - run: uv run --frozen zensical build -f zensical.toml
            - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
              with:
                  path: site
                  # Attempt-scoped so a re-run of the build does not leave two
                  # same-named artifacts in the run, which deploy-pages rejects.
                  name: github-pages-${{ github.run_attempt }}

    # deploy-pages looks the artifact up once, with no retry, through the
    # Actions artifact service, whose list can lag the upload: run in the job
    # that uploaded, it found none a fraction of a second after the upload
    # finalized, and lags of tens of seconds are reported upstream. So the
    # deploy is a job of its own, as in GitHub's Pages workflows, and a failed
    # attempt is retried twice, 60 s and then 120 s later. This is bounded
    # recovery: a lag longer than about three minutes still fails the job, and
    # re-running the failed job retries again. The artifact's name comes from
    # the build job, so re-running only the deploy (a later attempt) still
    # finds the artifact the earlier build uploaded.
    deploy:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            # The latest attempt that ran: when the job succeeds, the one that deployed.
            url:
                ${{ steps.deployment-3.outputs.page_url ||
                steps.deployment-2.outputs.page_url ||
                steps.deployment-1.outputs.page_url }}
        steps:
            - id: deployment-1
              continue-on-error: true
              uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
              with:
                  artifact_name: ${{ needs.build.outputs.artifact }}
            - name: Wait before the second attempt
              if: steps.deployment-1.outcome == 'failure'
              run: sleep 60
            - id: deployment-2
              if: steps.deployment-1.outcome == 'failure'
              continue-on-error: true
              uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
              with:
                  artifact_name: ${{ needs.build.outputs.artifact }}
            - name: Wait before the third attempt
              if: steps.deployment-2.outcome == 'failure'
              run: sleep 120
            - id: deployment-3
              if: steps.deployment-2.outcome == 'failure'
              uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
              with:
                  artifact_name: ${{ needs.build.outputs.artifact }}
