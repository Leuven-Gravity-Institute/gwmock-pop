name: CI
on:
    pull_request:
        branches: [main]
    push:
        branches: [main]
    workflow_dispatch:
    workflow_call:

jobs:
    test:
        strategy:
            matrix:
                # Latest resolutions run everywhere; the SPEC 0 minimum
                # (lowest-direct) runs on ubuntu with the oldest supported
                # Python, since floor versions predate newer interpreters'
                # wheels.
                python-version: ['3.12', '3.13', '3.14']
                os: [ubuntu-latest, windows-latest, macos-latest]
                resolution: [highest]
                include:
                    - os: ubuntu-latest
                      python-version: '3.12'
                      resolution: lowest-direct
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  python-version: ${{ matrix.python-version }}
                  enable-cache: 'true'

            - name: Install dependencies
              shell: bash
              env:
                  RESOLUTION: ${{ matrix.resolution }}
              run: |
                  if [ "$RESOLUTION" = "lowest-direct" ]; then
                      uv sync --group dev --upgrade --resolution lowest-direct
                  else
                      uv sync --group dev --upgrade
                  fi

            - name: Run tests with pytest
              run: uv run --no-sync pytest

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  slug: leuven-gravity-institute/gwsim_pop

    test-core:
        # The newest Python, where h5py publishes no wheel yet. The package installs with its core
        # dependencies only, and everything but HDF5 catalogues works there without importing h5py.
        # Only the package and pytest are installed, and the tests run against the installed package
        # rather than the source tree. `tests/conftest.py` configures hypothesis, which is a dev
        # dependency and which none of these tests use, so it is not loaded.
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  python-version: '3.15'

            - name: Install the package and pytest only
              run: |
                  uv venv
                  uv pip install . pytest

            - name: Run the core-dependency tests
              run: >-
                  uv run --no-sync pytest -p no:cacheprovider --noconftest -o
                  addopts= -o pythonpath= tests/test_core_install.py
                  tests/test_optional.py tests/test_import.py
                  tests/test_lazy_jax_import.py
