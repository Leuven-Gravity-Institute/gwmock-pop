[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "gwmock-pop"
authors = [{ name = "Isaac C. F. Wong" }]
description = "A python package for simulating populations of gravitational-wave sources."
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
  "typer>=0.16.0",   # click 8.2 compatibility; the SPEC 0 floor (0.13) predates it
  "jax>=0.5.0",
  "PyYAML>=6.0",
  "ruyaml>=0.91.0",
  "pydantic>=2.9.0",
  "h5py>=3.12.1",
  "networkx>=3.4",
]

[dependency-groups]
dev = [
  "astropy>=8.0.1",
  "hypothesis>=6.165.10",
  "prek>=0.5.0",
  "pytest-cov>=7.1.0",
  "pytest-mock>=3.15.1",
  "pytest>=9.1.1",
  "pytest-github-actions-annotate-failures>=0.4.2",
  "mutmut>=3.7.0",
]
docs = ["zensical>=0.0.57", "mkdocstrings-python>=2.0.7"]
build = ["hatch>=1.18.0"]
release = ["git-cliff>=2.13.1"]

[project.scripts]
gwmock-pop = "gwmock_pop.cli.main:app"

[project.urls]
Documentation = "https://leuven-gravity-institute.github.io/gwmock-pop/"
Source = "https://github.com/Leuven-Gravity-Institute/gwmock-pop"
Tracker = "https://github.com/Leuven-Gravity-Institute/gwmock-pop/issues"
Home = "https://github.com/Leuven-Gravity-Institute/gwmock-pop"
"Release Notes" = "https://github.com/Leuven-Gravity-Institute/gwmock-pop/releases"

[tool.dependency-support-policy]
policy = "spec0"
lock = "minimal"

[tool.uv-dynamic-versioning]
vcs = "git"      # default
style = "pep440"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/gwmock_pop"]
include = ["src/gwmock_pop/configs/*.yaml"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 0

[tool.pytest.ini_options]
addopts = "--cov-report xml:coverage.xml --cov src --cov-append -m 'not integration' --cov-report=term-missing"
pythonpath = ["src", "scripts"]
testpaths = "tests"
junit_family = "xunit2"
markers = [
  "integration: end-to-end tests excluded from the default run",
  "notebooks: marks as notebook test",
  "gpu: marks as gpu test",
  "spark: marks tests which need Spark",
  "slow: marks tests as slow",
  "unit: fast offline tests",
]

[tool.mutmut]
# mutmut copies the project into `mutants/` and mutates the copy, so the working tree is untouched.
source_paths = ["src/gwmock_pop"]
# `tests/`, `pyproject.toml` and `uv.lock` are copied by default. `examples/` is not, and
# tests/cli/test_cli_validate.py walks the real examples tree, so it has to come along or every
# mutant is judged against a suite that errors for reasons unrelated to the mutation.
also_copy = ["examples/"]
pytest_add_cli_args_test_selection = ["tests/"]
# The default `addopts` turn on coverage, an XML report and a JUnit file. Under mutation testing
# they cost more than the test run itself and the reports get overwritten once per mutant, so the
# ini value is cleared and only the marker filter is restated. Integration, notebooks, gpu, spark
# and slow tests are excluded as well: a mutant is judged by the fast unit suite.
pytest_add_cli_args = [
  "--override-ini=addopts=",
  # The ini's `pythonpath` entries have to go too, and this one is load-bearing, not a speed-up.
  # mutmut puts `mutants/src` at the front of `sys.path` and deletes `src` from it, but pytest
  # re-inserts its `pythonpath` entries when it builds its config, so the real `src` lands back in
  # front of the mutated copy and every test imports unmutated code. mutmut then records no
  # test for any function and reports the whole package as "no tests" -- 15556 of 15960 mutants
  # never run. Clearing the ini leaves `mutants/src` as the only source on the path.
  "--override-ini=pythonpath=",
  # `tests/test_release_version.py` imports `release_version` from `scripts/`, which mutmut does
  # not copy into `mutants/` and which the cleared `pythonpath` above takes off the path. Without
  # this the import fails, pytest interrupts collection, and every mutant is then judged against a
  # suite that never ran. Skipped rather than made importable: the mutants come from `source_paths`,
  # so a release-tooling test can only add runtime here, never a verdict. Plain `pytest` runs it.
  "--ignore=tests/test_release_version.py",
  "-m",
  "not integration and not notebooks and not gpu and not spark and not slow",
]
# `mutate_only_covered_lines` is deliberately left off. It would cut the mutant count, but its
# coverage pass ends in `_unload_modules_not_in()`, which drops every module from `sys.modules`;
# the next in-process pytest run then re-imports numpy and dies with
# "ImportError: cannot load module more than once per process", because a C extension cannot be
# initialised twice in one interpreter. Verified on beelink, 2026-08-18.

[tool.ruff]
line-length = 120 # Matches Black's default
target-version = "py312" # Align with CI (3.12–3.14) and requires-python (>=3.12)
lint.extend-select = [
  "E",
  "F",
  "W",   # pycodestyle errors and warnings
  "I",   # isort rules
  "UP",  # pyupgrade rules
  "C90", # McCabe complexity
  "N",   # PEP8 naming
  "B",   # Bugbear (opinionated checks)
  "A",   # Flake8-builtins
  "C4",  # Flake8-comprehensions
  "PT",  # Flake8-pytest
  "RUF", # Ruff-specific rules
  "PL",  # Add pylint rules for fuller coverage
  "SIM", # Similarities
  "T10", # Debugger statements
  "DOC", # Docstring
  "D",   # Doc style
  "S",   # Security
]
lint.ignore = [
  "E501", # Line length (handled by formatter)
  "C901", # Disable overly strict complexity checks (optional, adjust as needed)
]
fix = true # Enable autofix
lint.unfixable = [] # List rules that should not be autofixed, if any

[tool.ruff.format]
quote-style = "double"       # Use double quotes for strings
indent-style = "space"       # Use spaces for indentation
docstring-code-format = true # Format code in docstrings

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Ignore specific rules in the tests directory
"tests/*" = ["S101", "ARG001", "PLC0415", "PLR2004"]
# S101: allow assert statements
# ARG001: allow unused function arguments (common in fixtures)
# PLC0415: allow import statements not at the top level
# PLR2004: allow magic values in the unit tests

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
